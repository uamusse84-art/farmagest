<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1360" viewBox="0 0 1900 1360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="cheia" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f3b57"/>
    </marker>
    <marker id="aberta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#4a6076" stroke-width="1.6"/>
    </marker>
  </defs>

  <rect width="1900" height="1360" fill="#ffffff"/>
  <text x="950" y="34" text-anchor="middle" font-size="25" font-weight="bold" fill="#12293d">Diagrama de Sequencia - Registar Venda (com abate FEFO)</text>

  <!-- ==================== Participantes ==================== -->
  <g>
    <circle cx="110" cy="76" r="10" fill="#ffffff" stroke="#1f3b57" stroke-width="2"/>
    <line x1="110" y1="86" x2="110" y2="110" stroke="#1f3b57" stroke-width="2"/>
    <line x1="94" y1="95" x2="126" y2="95" stroke="#1f3b57" stroke-width="2"/>
    <line x1="110" y1="110" x2="98" y2="128" stroke="#1f3b57" stroke-width="2"/>
    <line x1="110" y1="110" x2="122" y2="128" stroke="#1f3b57" stroke-width="2"/>
    <text x="110" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#12293d">Operador</text>
  </g>

  <g font-size="14" font-weight="bold" fill="#12293d" text-anchor="middle">
    <rect x="240" y="80" width="200" height="48" rx="4" fill="#dbe7f1" stroke="#1f3b57" stroke-width="2"/>
    <text x="340" y="110">:Router</text>
    <rect x="490" y="80" width="240" height="48" rx="4" fill="#dbe7f1" stroke="#1f3b57" stroke-width="2"/>
    <text x="610" y="110">:VendaController</text>
    <rect x="790" y="80" width="180" height="48" rx="4" fill="#dbe7f1" stroke="#1f3b57" stroke-width="2"/>
    <text x="880" y="110">:Validator</text>
    <rect x="1060" y="80" width="180" height="48" rx="4" fill="#f6e3c6" stroke="#1f3b57" stroke-width="2.4"/>
    <text x="1150" y="110">:Venda</text>
    <rect x="1330" y="80" width="220" height="48" rx="4" fill="#f6e3c6" stroke="#1f3b57" stroke-width="2"/>
    <text x="1440" y="110">:MovimentoStock</text>
    <rect x="1640" y="80" width="200" height="48" rx="4" fill="#e3eee6" stroke="#1f3b57" stroke-width="2"/>
    <text x="1740" y="110">:BD (MySQL)</text>
  </g>

  <!-- ==================== Linhas de vida ==================== -->
  <g stroke="#7b8fa3" stroke-width="1.4" stroke-dasharray="8,7">
    <line x1="110" y1="160" x2="110" y2="1240"/>
    <line x1="340" y1="128" x2="340" y2="1240"/>
    <line x1="610" y1="128" x2="610" y2="1240"/>
    <line x1="880" y1="128" x2="880" y2="1240"/>
    <line x1="1150" y1="128" x2="1150" y2="1240"/>
    <line x1="1440" y1="128" x2="1440" y2="1240"/>
    <line x1="1740" y1="128" x2="1740" y2="1240"/>
  </g>

  <!-- ==================== Barras de activacao ==================== -->
  <g fill="#c9d8e5" stroke="#1f3b57" stroke-width="1.2">
    <rect x="334" y="160" width="12" height="50"/>
    <rect x="604" y="200" width="12" height="985"/>
    <rect x="874" y="295" width="12" height="45"/>
    <rect x="1144" y="375" width="12" height="765"/>
    <rect x="1434" y="864" width="12" height="86"/>
    <rect x="1734" y="415" width="12" height="680"/>
  </g>

  <!-- ==================== Mensagens ==================== -->
  <g stroke="#1f3b57" stroke-width="1.8" fill="none">
    <line x1="110" y1="165" x2="328" y2="165" marker-end="url(#cheia)"/>
    <line x1="346" y1="205" x2="598" y2="205" marker-end="url(#cheia)"/>
    <path d="M 616 232 L 700 232 L 700 262 L 618 262" marker-end="url(#cheia)"/>
    <line x1="616" y1="300" x2="868" y2="300" marker-end="url(#cheia)"/>
    <line x1="616" y1="380" x2="1138" y2="380" marker-end="url(#cheia)"/>
    <line x1="1156" y1="420" x2="1728" y2="420" marker-end="url(#cheia)"/>
    <line x1="1156" y1="462" x2="1728" y2="462" marker-end="url(#cheia)"/>
    <line x1="1156" y1="552" x2="1728" y2="552" marker-end="url(#cheia)"/>
    <line x1="1156" y1="600" x2="1728" y2="600" marker-end="url(#cheia)"/>
    <line x1="1156" y1="782" x2="1728" y2="782" marker-end="url(#cheia)"/>
    <line x1="1156" y1="826" x2="1728" y2="826" marker-end="url(#cheia)"/>
    <line x1="1156" y1="870" x2="1428" y2="870" marker-end="url(#cheia)"/>
    <line x1="1446" y1="908" x2="1728" y2="908" marker-end="url(#cheia)"/>
    <line x1="1156" y1="1052" x2="1728" y2="1052" marker-end="url(#cheia)"/>
    <line x1="1156" y1="1092" x2="1728" y2="1092" marker-end="url(#cheia)"/>
  </g>

  <!-- Retornos (tracejado) -->
  <g stroke="#4a6076" stroke-width="1.6" fill="none" stroke-dasharray="8,6">
    <line x1="868" y1="335" x2="620" y2="335" marker-end="url(#aberta)"/>
    <line x1="1428" y1="944" x2="1162" y2="944" marker-end="url(#aberta)"/>
    <line x1="1138" y1="1136" x2="622" y2="1136" marker-end="url(#aberta)"/>
    <line x1="598" y1="1182" x2="116" y2="1182" marker-end="url(#aberta)"/>
  </g>

  <!-- Etiquetas das mensagens -->
  <g font-size="13.5" fill="#12293d">
    <text x="152" y="158">1: POST /vendas (carrinho, forma_pagamento, desconto, _csrf_token)</text>
    <text x="352" y="198">2: guardar(pedido)</text>
    <text x="712" y="252">3: extrairItens(pedido)</text>
    <text x="712" y="270" font-size="12" font-style="italic" fill="#5b7086">agrega quantidades repetidas</text>
    <text x="622" y="293">4: validar(forma_pagamento, desconto, observacoes)</text>
    <text x="628" y="329" fill="#4a6076">5: sem erros</text>
    <text x="622" y="373" font-weight="bold">6: registar(itens, cabecalho, utilizadorId)</text>
    <text x="1162" y="413">7: beginTransaction()</text>
    <text x="1162" y="455">8: INSERT INTO vendas (numero, estado = 'concluida')</text>
    <text x="1162" y="545">9: SELECT medicamento (verifica se esta ativo)</text>
    <text x="1162" y="593">10: SELECT lotes WHERE qtd &gt; 0 AND validade &gt;= CURDATE()</text>
    <text x="1162" y="613" font-weight="bold">&#160;&#160;&#160;&#160;&#160;ORDER BY data_validade ASC ... FOR UPDATE</text>
    <text x="1162" y="775">11: INSERT INTO itens_venda (lote_id, quantidade, preco)</text>
    <text x="1162" y="819">12: UPDATE lotes SET quantidade_atual = quantidade_atual - n</text>
    <text x="1162" y="863">13: registar(lote, 'saida', -n, numero)</text>
    <text x="1452" y="901">14: INSERT INTO movimentos_stock</text>
    <text x="1180" y="937" fill="#4a6076">15: ok</text>
    <text x="1162" y="1045">16: UPDATE vendas SET subtotal, desconto, total</text>
    <text x="1162" y="1085" font-weight="bold">17: commit()</text>
    <text x="640" y="1130" fill="#4a6076">18: vendaId</text>
    <text x="130" y="1176" fill="#4a6076">19: 302 Redirect /vendas/{id} + mensagem de sucesso</text>
  </g>

  <!-- ==================== Fragmento: ciclo por medicamento ==================== -->
  <rect x="1075" y="490" width="785" height="520" fill="none" stroke="#c07a2b" stroke-width="2"/>
  <path d="M 1075 490 L 1215 490 L 1215 514 L 1199 526 L 1075 526 z" fill="#f6e3c6" stroke="#c07a2b" stroke-width="2"/>
  <text x="1088" y="510" font-size="13.5" font-weight="bold" fill="#8a5312">loop</text>
  <text x="1228" y="510" font-size="13.5" fill="#8a5312">[para cada medicamento do carrinho]</text>

  <!-- Nota: falta de stock -->
  <path d="M 1180 626 L 1690 626 L 1690 700 L 1180 700 z" fill="#fdecec" stroke="#b4494b" stroke-width="1.5"/>
  <text x="1194" y="648" font-size="13" fill="#8a2b2d">Se a soma dos lotes elegiveis for inferior a quantidade pedida:</text>
  <text x="1194" y="668" font-size="13" font-weight="bold" fill="#8a2b2d">rollBack() e RegraNegocioException - nada e gravado.</text>
  <text x="1194" y="688" font-size="12.5" font-style="italic" fill="#8a2b2d">O mesmo acontece se o medicamento estiver inativo.</text>

  <!-- Fragmento interno: FEFO -->
  <rect x="1095" y="712" width="750" height="258" fill="none" stroke="#2f7d54" stroke-width="2"/>
  <path d="M 1095 712 L 1235 712 L 1235 736 L 1219 748 L 1095 748 z" fill="#dff0e5" stroke="#2f7d54" stroke-width="2"/>
  <text x="1108" y="732" font-size="13.5" font-weight="bold" fill="#1d5c3c">loop</text>
  <text x="1248" y="732" font-size="13.5" fill="#1d5c3c">[enquanto faltar quantidade: lote a lote, por validade crescente]</text>

  <!-- ==================== Notas laterais ==================== -->
  <path d="M 60 380 L 560 380 L 560 470 L 60 470 z" fill="#eef4fa" stroke="#5b7086" stroke-width="1.5"/>
  <text x="74" y="404" font-size="13" font-weight="bold" fill="#12293d">Transacao atomica</text>
  <text x="74" y="426" font-size="12.5" fill="#1c2b38">Todo o passo 6 corre dentro de uma transacao.</text>
  <text x="74" y="446" font-size="12.5" fill="#1c2b38">Qualquer excecao faz rollBack(): ou a venda e</text>
  <text x="74" y="464" font-size="12.5" fill="#1c2b38">gravada por inteiro, ou nao e gravada de todo.</text>

  <path d="M 60 560 L 560 560 L 560 686 L 60 686 z" fill="#eef4fa" stroke="#5b7086" stroke-width="1.5"/>
  <text x="74" y="584" font-size="13" font-weight="bold" fill="#12293d">FEFO - First Expired, First Out</text>
  <text x="74" y="606" font-size="12.5" fill="#1c2b38">Os lotes sao consumidos por ordem crescente de</text>
  <text x="74" y="624" font-size="12.5" fill="#1c2b38">data de validade, o que reduz o desperdicio por</text>
  <text x="74" y="642" font-size="12.5" fill="#1c2b38">expiracao. Uma so quantidade pedida pode por isso</text>
  <text x="74" y="660" font-size="12.5" fill="#1c2b38">originar varias linhas em itens_venda.</text>
  <text x="74" y="680" font-size="12.5" font-style="italic" fill="#5b7086">Ver Lote::disponiveisFefo() e Venda::abaterStock().</text>

  <path d="M 60 760 L 560 760 L 560 872 L 60 872 z" fill="#eef4fa" stroke="#5b7086" stroke-width="1.5"/>
  <text x="74" y="784" font-size="13" font-weight="bold" fill="#12293d">FOR UPDATE - concorrencia</text>
  <text x="74" y="806" font-size="12.5" fill="#1c2b38">A clausula FOR UPDATE bloqueia as linhas dos lotes</text>
  <text x="74" y="824" font-size="12.5" fill="#1c2b38">ate ao fim da transacao. Sem ela, dois operadores</text>
  <text x="74" y="842" font-size="12.5" fill="#1c2b38">em caixas diferentes poderiam vender simultaneamente</text>
  <text x="74" y="860" font-size="12.5" fill="#1c2b38">o mesmo stock e deixar a quantidade negativa.</text>
</svg>
