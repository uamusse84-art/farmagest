<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1360" viewBox="0 0 1900 1360" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="triangulo" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#ffffff" stroke="#5b7086" stroke-width="1.5"/>
    </marker>
    <marker id="losango" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="15" markerHeight="11" orient="auto">
      <path d="M 0 5 L 7 0 L 14 5 L 7 10 z" fill="#1f3b57" stroke="#1f3b57" stroke-width="1"/>
    </marker>
  </defs>

  <rect width="1900" height="1360" fill="#ffffff"/>
  <text x="950" y="30" text-anchor="middle" font-size="25" font-weight="bold" fill="#12293d">Diagrama de Classes - FarmaGest</text>

  <!-- ==================== Classe base ==================== -->
  <g>
    <rect x="730" y="45" width="440" height="315" fill="#eef2f6" stroke="#1f3b57" stroke-width="2"/>
    <rect x="730" y="45" width="440" height="52" fill="#dde6ee" stroke="#1f3b57" stroke-width="2"/>
    <text x="950" y="66" text-anchor="middle" font-size="12" font-style="italic" fill="#4a5f74">&#171;abstract&#187;</text>
    <text x="950" y="87" text-anchor="middle" font-size="18" font-weight="bold" font-style="italic" fill="#12293d">Model</text>
    <g font-size="13" fill="#1c2b38">
      <text x="744" y="120"># tabela: string</text>
      <text x="744" y="140"># preenchiveis: string[]</text>
      <text x="744" y="160"># chave: string</text>
      <text x="744" y="180"># ordemOmissao: string</text>
    </g>
    <line x1="730" y1="194" x2="1170" y2="194" stroke="#1f3b57" stroke-width="1.5"/>
    <g font-size="13" fill="#1c2b38">
      <text x="744" y="214">+ encontrar(id): array</text>
      <text x="744" y="234">+ todos(ordem): array</text>
      <text x="744" y="254">+ criar(dados): int</text>
      <text x="744" y="274">+ atualizar(id, dados): bool</text>
      <text x="744" y="294">+ eliminar(id): bool</text>
      <text x="744" y="314"># condicaoPesquisa(cols, termo, par): string</text>
      <text x="744" y="334"># paginarConsulta(sql, cont, par, pag): array</text>
      <text x="744" y="354"># filtrar(dados): array</text>
    </g>
  </g>

  <!-- ==================== Arvore de generalizacao ==================== -->
  <g stroke="#5b7086" stroke-width="1.6" fill="none">
    <line x1="950" y1="400" x2="950" y2="362" marker-end="url(#triangulo)"/>
    <line x1="60" y1="400" x2="1790" y2="400"/>
    <line x1="60" y1="400" x2="60" y2="770"/>
    <line x1="60" y1="770" x2="1690" y2="770"/>
    <!-- descidas para a linha superior -->
    <line x1="320" y1="400" x2="320" y2="450"/>
    <line x1="740" y1="400" x2="740" y2="450"/>
    <line x1="1160" y1="400" x2="1160" y2="450"/>
    <line x1="1580" y1="400" x2="1580" y2="450"/>
    <!-- descidas para a linha inferior -->
    <line x1="210" y1="770" x2="210" y2="810"/>
    <line x1="580" y1="770" x2="580" y2="810"/>
    <line x1="950" y1="770" x2="950" y2="810"/>
    <line x1="1320" y1="770" x2="1320" y2="810"/>
    <line x1="1690" y1="770" x2="1690" y2="810"/>
  </g>
  <text x="1800" y="394" text-anchor="end" font-size="13" font-style="italic" fill="#5b7086">todas as entidades herdam de Model</text>

  <!-- ==================== Linha A: entidades de referencia ==================== -->
  <!-- Cliente -->
  <g>
    <rect x="140" y="450" width="360" height="260" fill="#f4f8fb" stroke="#1f3b57" stroke-width="1.8"/>
    <rect x="140" y="450" width="360" height="38" fill="#dbe7f1" stroke="#1f3b57" stroke-width="1.8"/>
    <text x="320" y="476" text-anchor="middle" font-size="16" font-weight="bold" fill="#12293d">Cliente</text>
    <g font-size="13" fill="#1c2b38">
      <text x="154" y="508">- id: int</text>
      <text x="154" y="528">- nome: string</text>
      <text x="154" y="548">- nuit: string</text>
      <text x="154" y="568">- telefone: string</text>
      <text x="154" y="588">- email: string</text>
      <text x="154" y="608">- endereco: string</text>
    </g>
    <line x1="140" y1="622" x2="500" y2="622" stroke="#1f3b57" stroke-width="1.3"/>
    <g font-size="13" fill="#1c2b38">
      <text x="154" y="642">+ paginar(pesquisa, pag): array</text>
      <text x="154" y="662">+ temVendas(id): bool</text>
      <text x="154" y="682">+ historico(id): array</text>
    </g>
  </g>

  <!-- Utilizador -->
  <g>
    <rect x="560" y="450" width="360" height="260" fill="#f4f8fb" stroke="#1f3b57" stroke-width="1.8"/>
    <rect x="560" y="450" width="360" height="38" fill="#dbe7f1" stroke="#1f3b57" stroke-width="1.8"/>
    <text x="740" y="476" text-anchor="middle" font-size="16" font-weight="bold" fill="#12293d">Utilizador</text>
    <g font-size="13" fill="#1c2b38">
      <text x="574" y="508">- id: int</text>
      <text x="574" y="528">- nome: string</text>
      <text x="574" y="548">- email: string</text>
      <text x="574" y="568">- palavraPasse: string (bcrypt)</text>
      <text x="574" y="588">- perfil: enum</text>
      <text x="574" y="608">- ativo: bool</text>
      <text x="574" y="628">- ultimoAcesso: datetime</text>
    </g>
    <line x1="560" y1="642" x2="920" y2="642" stroke="#1f3b57" stroke-width="1.3"/>
    <g font-size="13" fill="#1c2b38">
      <text x="574" y="662">+ porEmail(email): array</text>
      <text x="574" y="682">+ registarAcesso(id): void</text>
    </g>
  </g>

  <!-- Fornecedor -->
  <g>
    <rect x="980" y="450" width="360" height="260" fill="#f4f8fb" stroke="#1f3b57" stroke-width="1.8"/>
    <rect x="980" y="450" width="360" height="38" fill="#dbe7f1" stroke="#1f3b57" stroke-width="1.8"/>
    <text x="1160" y="476" text-anchor="middle" font-size="16" font-weight="bold" fill="#12293d">Fornecedor</text>
    <g font-size="13" fill="#1c2b38">
      <text x="994" y="508">- id: int</text>
      <text x="994" y="528">- nome: string</text>
      <text x="994" y="548">- nuit: string</text>
      <text x="994" y="568">- telefone: string</text>
      <text x="994" y="588">- email: string</text>
      <text x="994" y="608">- endereco: string</text>
      <text x="994" y="628">- ativo: bool</text>
    </g>
    <line x1="980" y1="642" x2="1340" y2="642" stroke="#1f3b57" stroke-width="1.3"/>
    <g font-size="13" fill="#1c2b38">
      <text x="994" y="662">+ ativos(): array</text>
      <text x="994" y="682">+ temLotes(id): bool</text>
    </g>
  </g>

  <!-- Categoria -->
  <g>
    <rect x="1400" y="450" width="360" height="260" fill="#f4f8fb" stroke="#1f3b57" stroke-width="1.8"/>
    <rect x="1400" y="450" width="360" height="38" fill="#dbe7f1" stroke="#1f3b57" stroke-width="1.8"/>
    <text x="1580" y="476" text-anchor="middle" font-size="16" font-weight="bold" fill="#12293d">Categoria</text>
    <g font-size="13" fill="#1c2b38">
      <text x="1414" y="508">- id: int</text>
      <text x="1414" y="528">- nome: string</text>
      <text x="1414" y="548">- descricao: string</text>
    </g>
    <line x1="1400" y1="562" x2="1760" y2="562" stroke="#1f3b57" stroke-width="1.3"/>
    <g font-size="13" fill="#1c2b38">
      <text x="1414" y="582">+ comContagem(): array</text>
      <text x="1414" y="602">+ temMedicamentos(id): bool</text>
    </g>
  </g>

  <!-- ==================== Linha B: entidades operacionais ==================== -->
  <!-- Venda -->
  <g>
    <rect x="55" y="810" width="310" height="350" fill="#fdf6ec" stroke="#1f3b57" stroke-width="2.2"/>
    <rect x="55" y="810" width="310" height="38" fill="#f6e3c6" stroke="#1f3b57" stroke-width="2.2"/>
    <text x="210" y="836" text-anchor="middle" font-size="16" font-weight="bold" fill="#12293d">Venda</text>
    <g font-size="12.5" fill="#1c2b38">
      <text x="67" y="868">- id: int</text>
      <text x="67" y="888">- numero: string</text>
      <text x="67" y="908">- clienteId: int [0..1]</text>
      <text x="67" y="928">- utilizadorId: int</text>
      <text x="67" y="948">- dataVenda: datetime</text>
      <text x="67" y="968">- subtotal: decimal</text>
      <text x="67" y="988">- desconto: decimal</text>
      <text x="67" y="1008">- total: decimal</text>
      <text x="67" y="1028">- formaPagamento: enum</text>
      <text x="67" y="1048">- estado: enum</text>
    </g>
    <line x1="55" y1="1062" x2="365" y2="1062" stroke="#1f3b57" stroke-width="1.3"/>
    <g font-size="12.5" fill="#1c2b38">
      <text x="67" y="1082" font-weight="bold">+ registar(itens, cab, utilId): int</text>
      <text x="67" y="1102">- abaterStock(item): float</text>
      <text x="67" y="1122">+ anular(id, utilId, motivo): void</text>
      <text x="67" y="1142">- gerarNumero(): string</text>
    </g>
  </g>

  <!-- ItemVenda -->
  <g>
    <rect x="425" y="810" width="310" height="350" fill="#fdf6ec" stroke="#1f3b57" stroke-width="1.8"/>
    <rect x="425" y="810" width="310" height="38" fill="#f6e3c6" stroke="#1f3b57" stroke-width="1.8"/>
    <text x="580" y="836" text-anchor="middle" font-size="16" font-weight="bold" fill="#12293d">ItemVenda</text>
    <g font-size="12.5" fill="#1c2b38">
      <text x="437" y="868">- id: int</text>
      <text x="437" y="888">- vendaId: int</text>
      <text x="437" y="908">- loteId: int</text>
      <text x="437" y="928">- medicamentoId: int</text>
      <text x="437" y="948">- quantidade: int</text>
      <text x="437" y="968">- precoUnitario: decimal</text>
      <text x="437" y="988">- subtotal: decimal</text>
    </g>
    <line x1="425" y1="1002" x2="735" y2="1002" stroke="#1f3b57" stroke-width="1.3"/>
    <text x="437" y="1030" font-size="12.5" font-style="italic" fill="#4a5f74">Uma linha por lote consumido:</text>
    <text x="437" y="1050" font-size="12.5" font-style="italic" fill="#4a5f74">a mesma quantidade pedida pode</text>
    <text x="437" y="1070" font-size="12.5" font-style="italic" fill="#4a5f74">originar varios itens (FEFO).</text>
  </g>

  <!-- MovimentoStock -->
  <g>
    <rect x="795" y="810" width="310" height="350" fill="#fdf6ec" stroke="#1f3b57" stroke-width="1.8"/>
    <rect x="795" y="810" width="310" height="38" fill="#f6e3c6" stroke="#1f3b57" stroke-width="1.8"/>
    <text x="950" y="836" text-anchor="middle" font-size="16" font-weight="bold" fill="#12293d">MovimentoStock</text>
    <g font-size="12.5" fill="#1c2b38">
      <text x="807" y="868">- id: int</text>
      <text x="807" y="888">- loteId: int</text>
      <text x="807" y="908">- utilizadorId: int</text>
      <text x="807" y="928">- tipo: enum</text>
      <text x="807" y="948">- quantidade: int (+/-)</text>
      <text x="807" y="968">- referencia: string</text>
      <text x="807" y="988">- observacao: string</text>
      <text x="807" y="1008">- criadoEm: datetime</text>
    </g>
    <line x1="795" y1="1022" x2="1105" y2="1022" stroke="#1f3b57" stroke-width="1.3"/>
    <g font-size="12.5" fill="#1c2b38">
      <text x="807" y="1042">+ registar(loteId, tipo, qtd, ...): void</text>
      <text x="807" y="1062">+ paginar(tipo, de, ate, pag): array</text>
      <text x="807" y="1082">+ doLote(loteId): array</text>
    </g>
  </g>

  <!-- Lote -->
  <g>
    <rect x="1165" y="810" width="310" height="350" fill="#fdf6ec" stroke="#1f3b57" stroke-width="2.2"/>
    <rect x="1165" y="810" width="310" height="38" fill="#f6e3c6" stroke="#1f3b57" stroke-width="2.2"/>
    <text x="1320" y="836" text-anchor="middle" font-size="16" font-weight="bold" fill="#12293d">Lote</text>
    <g font-size="12.5" fill="#1c2b38">
      <text x="1177" y="868">- id: int</text>
      <text x="1177" y="888">- medicamentoId: int</text>
      <text x="1177" y="908">- fornecedorId: int</text>
      <text x="1177" y="928">- numeroLote: string</text>
      <text x="1177" y="948">- dataValidade: date</text>
      <text x="1177" y="968">- quantidadeInicial: int</text>
      <text x="1177" y="988">- quantidadeAtual: int</text>
      <text x="1177" y="1008">- precoCompra: decimal</text>
      <text x="1177" y="1028">- dataEntrada: date</text>
    </g>
    <line x1="1165" y1="1042" x2="1475" y2="1042" stroke="#1f3b57" stroke-width="1.3"/>
    <g font-size="12.5" fill="#1c2b38">
      <text x="1177" y="1062" font-weight="bold">+ disponiveisFefo(medId): array</text>
      <text x="1177" y="1082">+ stockDisponivel(medId): int</text>
      <text x="1177" y="1102">+ aExpirar(dias): array</text>
      <text x="1177" y="1122">+ expirados(): array</text>
    </g>
  </g>

  <!-- Medicamento -->
  <g>
    <rect x="1535" y="810" width="310" height="350" fill="#fdf6ec" stroke="#1f3b57" stroke-width="1.8"/>
    <rect x="1535" y="810" width="310" height="38" fill="#f6e3c6" stroke="#1f3b57" stroke-width="1.8"/>
    <text x="1690" y="836" text-anchor="middle" font-size="16" font-weight="bold" fill="#12293d">Medicamento</text>
    <g font-size="12.5" fill="#1c2b38">
      <text x="1547" y="868">- id: int</text>
      <text x="1547" y="888">- codigo: string</text>
      <text x="1547" y="908">- nome: string</text>
      <text x="1547" y="928">- categoriaId: int</text>
      <text x="1547" y="948">- principioAtivo: string</text>
      <text x="1547" y="968">- formaFarmaceutica: enum</text>
      <text x="1547" y="988">- dosagem: string</text>
      <text x="1547" y="1008">- precoVenda: decimal</text>
      <text x="1547" y="1028">- stockMinimo: int</text>
      <text x="1547" y="1048">- requerReceita: bool</text>
    </g>
    <line x1="1535" y1="1062" x2="1845" y2="1062" stroke="#1f3b57" stroke-width="1.3"/>
    <g font-size="12.5" fill="#1c2b38">
      <text x="1547" y="1082">+ comStock(id): array</text>
      <text x="1547" y="1102">+ disponiveisParaVenda(): array</text>
      <text x="1547" y="1122">+ abaixoDoMinimo(): array</text>
      <text x="1547" y="1142">+ proximoCodigo(): string</text>
    </g>
  </g>

  <!-- ==================== Associacoes ==================== -->
  <g stroke="#1f3b57" stroke-width="1.8" fill="none">
    <!-- Categoria para Medicamento -->
    <line x1="1580" y1="710" x2="1660" y2="810"/>
    <!-- Fornecedor para Lote -->
    <line x1="1180" y1="710" x2="1290" y2="810"/>
    <!-- Cliente para Venda -->
    <line x1="300" y1="710" x2="240" y2="810"/>
    <!-- Utilizador para Venda -->
    <line x1="660" y1="710" x2="300" y2="810"/>
    <!-- Utilizador para MovimentoStock -->
    <line x1="800" y1="710" x2="890" y2="810"/>
    <!-- Medicamento para Lote (adjacentes) -->
    <line x1="1535" y1="960" x2="1475" y2="960"/>
    <!-- Lote para MovimentoStock (adjacentes) -->
    <line x1="1165" y1="960" x2="1105" y2="960"/>
    <!-- Venda para ItemVenda (composicao) -->
    <line x1="365" y1="900" x2="425" y2="900" marker-start="url(#losango)"/>
    <!-- Lote para ItemVenda (contorna MovimentoStock por baixo) -->
    <path d="M 1290 1160 L 1290 1215 L 650 1215 L 650 1160"/>
    <!-- Medicamento para ItemVenda (contorna por baixo) -->
    <path d="M 1740 1160 L 1740 1270 L 520 1270 L 520 1160"/>
  </g>

  <!-- Multiplicidades -->
  <g font-size="13" fill="#12293d">
    <text x="1592" y="730">1</text>
    <text x="1640" y="800">0..*</text>
    <text x="1192" y="730">1</text>
    <text x="1268" y="800">0..*</text>
    <text x="278" y="730">0..1</text>
    <text x="246" y="800">0..*</text>
    <text x="628" y="730">1</text>
    <text x="308" y="800">0..*</text>
    <text x="806" y="730">1</text>
    <text x="862" y="802">0..*</text>
    <text x="1489" y="952">1</text>
    <text x="1432" y="952">0..*</text>
    <text x="1119" y="952">1</text>
    <text x="1062" y="952">0..*</text>
    <text x="376" y="892">1</text>
    <text x="663" y="892">1..*</text>
    <text x="1298" y="1180">1</text>
    <text x="658" y="1180">0..*</text>
    <text x="1748" y="1180">1</text>
    <text x="528" y="1180">0..*</text>
  </g>

  <!-- ==================== Legenda ==================== -->
  <rect x="55" y="1195" width="420" height="130" rx="8" fill="#ffffff" stroke="#c3d0dc" stroke-width="1.5"/>
  <text x="72" y="1222" font-size="15" font-weight="bold" fill="#12293d">Legenda</text>
  <line x1="75" y1="1246" x2="135" y2="1246" stroke="#5b7086" stroke-width="1.6"/>
  <path d="M 141 1240 L 153 1246 L 141 1252 z" fill="#ffffff" stroke="#5b7086" stroke-width="1.4"/>
  <text x="168" y="1251" font-size="13" fill="#1c2b38">Generalizacao (herda de Model)</text>
  <line x1="75" y1="1276" x2="135" y2="1276" stroke="#1f3b57" stroke-width="1.8"/>
  <text x="168" y="1281" font-size="13" fill="#1c2b38">Associacao com multiplicidade</text>
  <path d="M 75 1306 L 87 1300 L 99 1306 L 87 1312 z" fill="#1f3b57"/>
  <line x1="99" y1="1306" x2="135" y2="1306" stroke="#1f3b57" stroke-width="1.8"/>
  <text x="168" y="1311" font-size="13" fill="#1c2b38">Composicao (o todo controla a parte)</text>
</svg>
